name: Build NovTales Browser Reader
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  CI: 'true'
  EXPO_NO_TELEMETRY: '1'
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          path: source
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: LNReader/lnreader
          ref: a0c20e209c8b8d87c8982095e4ad44eafe13ee15
          path: reader
          persist-credentials: false
      - name: Apply browser integration
        working-directory: reader
        run: git apply ../source/novtales-browser.patch
      - uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: reader/pnpm-lock.yaml
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        working-directory: reader
        run: pnpm install --frozen-lockfile
      - name: Generate build environment
        working-directory: reader
        run: node scripts/generate-env-file.cjs --build-type 'NovTales Browser' --node-env production
      - name: Verify integration
        working-directory: reader
        run: |
          node node_modules/typescript/bin/tsc --noEmit
          node node_modules/eslint/bin/eslint.js src/plugins/helpers/browser.ts src/plugins/helpers/__tests__/browser.test.ts src/components/BrowserPageHost/BrowserPageHost.tsx src/plugins/pluginManager.ts src/plugins/__tests__/pluginManager.test.ts App.tsx
          node node_modules/jest/bin/jest.js --selectProjects rn --runInBand --runTestsByPath src/plugins/helpers/__tests__/browser.test.ts src/plugins/__tests__/pluginManager.test.ts
      - name: Generate Android project
        working-directory: reader
        run: node node_modules/expo/bin/cli prebuild --platform android --clean --no-install
      - uses: gradle/actions/setup-gradle@v6
      - name: Build separate preview APK
        working-directory: reader/android
        env:
          NODE_ENV: production
        run: |
          mkdir -p app/build/intermediates/sourcemaps/react/preRelease
          ./gradlew :app:assemblePreRelease --build-cache --parallel -PreactNativeArchitectures=arm64-v8a -PpreReleaseVersionName=2.1.4-novtales-browser -PpreReleaseVersionCode=4196400 --stacktrace
      - name: Package reader and source
        run: |
          mkdir -p package
          cp reader/android/app/build/outputs/apk/preRelease/app-preRelease.apk package/LNReader-NovTales.apk
          cp source/novtales-browser.js source/browser-plugins.min.json source/NOVTALES-BROWSER.md package/
          sha256sum package/LNReader-NovTales.apk > package/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: LNReader-NovTales-browser
          path: package/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
